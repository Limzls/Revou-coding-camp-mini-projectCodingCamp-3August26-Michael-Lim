<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

    <header>
        <h1>Expense & Budget Visualizer</h1>
        <button id="darkModeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            🌙
        </button>
    </header>

    <main>

        <section class="balance-card">
            <h2>Total Balance</h2>
            <p id="balance">Rp 0</p>
        </section>

        <section>
            <form id="expenseForm">

                <label for="itemName">Item Name</label>
                <input
                    type="text"
                    id="itemName"
                    placeholder="Enter item name"
                >

                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                >

                <label for="category">Category</label>
                <select id="category">
                    <option value="">Choose Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Fun">Fun</option>
                </select>

                <button type="submit">
                    Add Transaction
                </button>

            </form>
        </section>

        <section class="limit-section">
            <h2>Spending Limits</h2>
            <p class="limit-hint">Set a budget cap per category. Transactions over the limit will be highlighted.</p>
            <div class="limit-grid">
                <div class="limit-item">
                    <label for="limitFood">🍔 Food</label>
                    <input type="number" id="limitFood" placeholder="No limit" min="0">
                </div>
                <div class="limit-item">
                    <label for="limitTransport">🚗 Transport</label>
                    <input type="number" id="limitTransport" placeholder="No limit" min="0">
                </div>
                <div class="limit-item">
                    <label for="limitFun">🎉 Fun</label>
                    <input type="number" id="limitFun" placeholder="No limit" min="0">
                </div>
                <div class="limit-item">
                    <label for="limitOther">📦 Other</label>
                    <input type="number" id="limitOther" placeholder="No limit" min="0">
                </div>
            </div>
            <div id="limitStatus" class="limit-status"></div>
        </section>

        <section class="transaction-section">

            <div class="section-header">
                <h2>Transaction List</h2>
                <button id="sortBtn" aria-label="Sort by amount" title="Sort by amount: None">
                    Sort by Amount <span id="sortIcon">⇅</span>
                </button>
            </div>

            <ul id="transactionList">
                <!-- Data transaksi dari JavaScript -->
            </ul>

        </section>

        <section class="monthly-section">
            <div class="section-header">
                <h2>Monthly Summary</h2>
                <div class="month-nav">
                    <button id="prevMonth" aria-label="Previous month">&#8249;</button>
                    <span id="monthLabel"></span>
                    <button id="nextMonth" aria-label="Next month">&#8250;</button>
                </div>
            </div>

            <div id="monthlySummary"></div>
        </section>

        <section class="chart-section">

            <h2>Expense Distribution</h2>

            <canvas id="expenseChart"></canvas>

        </section>

    </main>

    
</body>

<!---->
<script src="js/script.js"></script>
</html>
